name: Pinned actions

on:
  pull_request:
    paths:
      - ".github/workflows/*"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-sha-pinned-actions:
    name: Ensure actions are pinned to a commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@9f71a10c9852b115cfcb146ec2d8d09e2b89593f # v2.1.1
        with:
          sha-only-paths: |
            .github/workflows/fourmolu.yaml
            .github/workflows/lint.yaml
