name: Lint

on:
  pull_request:
    paths:
      - "**.cabal"
      - "cabal.project"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  cabal-gild:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tfausak/cabal-gild-setup-action@1639b48019c070533ec2fb52cb802100b7e357a5 # v2
        with:
          version: 1.6.0.2
      - run: cabal-gild --input kitab.cabal --mode check
  hlint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 'Set up HLint'
      uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
      with:
        version: '3.10'

    - name: 'Run HLint'
      uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
      with:
        path: '["src/", "test/Test", "test/Main.hs", "app/"]'
        fail-on: warning
