name: CI

on:
  pull_request:
    paths:
      - "**.hs"
      - "**.cabal"
      - "doc/base/*"
      - ".github/workflows/*"
      - "cabal.project"
  push:
    branches:
      - master
  workflow_dispatch:

env:
    LANG: "en_GB.UTF-8"
    LANGUAGE: "en_GB.UTF-8"
    LC_ALL: "en_GB.UTF-8"
jobs:
  tests:
    name: "Test on ubuntu-24"
    runs-on:
      - ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - 9.12.4
    steps:

      - name: Set environment
        run: |
            sudo apt update
            sudo apt install -y locales pkg-config
            sudo locale-gen en_GB.UTF-8
            sudo update-locale LANG=en_GB.UTF-8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image sets GHCUP_INSTALL_BASE_PREFIX=/usr/local, but
      # haskell-actions/setup looks for GHC in $HOME/.ghcup/bin.
      - name: Install ghcup tools in $HOME
        run: echo "GHCUP_INSTALL_BASE_PREFIX=$HOME" >> "$GITHUB_ENV"

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "${{ matrix.ghc }}"
          cabal-version: "latest"

      - name: Install system dependencies
        run: |
           sudo apt install -y libgmp-dev zlib1g-dev zstd

      - name: Create freeze file
        run: cabal freeze --enable-tests --enable-benchmarks

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('./dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}

      - name: Build - ${{ matrix.ghc }}
        run: cabal build

      - name: Test - ${{ matrix.ghc }}
        run: cabal test

  package-macos:
    name: Test on macos-latest
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - 9.12.4
    steps:
      - name: Checkout base repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "${{ matrix.ghc }}"
          cabal-version: 'latest'
      - name: Configure
        run: |
          ARCHITECTURE=$(uname -m)
          echo "ARCH=$ARCHITECTURE" >> $GITHUB_ENV
          echo ${{ env.ARCH }}
          cabal configure --enable-tests
      - name: Freeze
        run: cabal freeze --project-file=cabal.release.project
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('./dist-newstyle/cache/plan.json') }}

          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}

      - name: Build
        run: cabal build --project-file=cabal.release.project

      - name: Test
        run: cabal test --project-file=cabal.release.project all

      - name: Install
        run: |
          mkdir -p distribution/
          cp -f $(cabal --project-file=cabal.release.project list-bin kitab) distribution/

      - name: File type
        run: file distribution/kitab

      - name: Package the kitab-head executable
        run: |
          KITAB_EXEC=distribution/kitab
          DIR=$(dirname $KITAB_EXEC)
          FILE=$(basename $KITAB_EXEC)
          KITAB_EXEC_TAR=kitab-head-${{ runner.os }}-${{ env.ARCH }}.tar.zst
          tar --zstd -cvf $KITAB_EXEC_TAR -C $DIR $FILE
          echo KITAB_EXEC_TAR=$KITAB_EXEC_TAR >> $GITHUB_ENV

      - name: Upload the kitab-head executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitab-${{ runner.os }}-${{ env.ARCH }}
          path: ${{ env.KITAB_EXEC_TAR }}

  package-linux-static:
      name: Test on alpine-3.20
      runs-on: ubuntu-latest
      container: "alpine:3.20"
      strategy:
        fail-fast: false
        matrix:
          ghc:
            - 9.12.4
      steps: 
      - name: Install extra dependencies
        shell: sh
        run: | 
            apk add bash binutils-gold curl \
                curl file g++ gcc git gmp-dev \
                jq libc-dev libffi-dev make \
                musl-dev ncurses-dev perl pkgconfig \
                sudo tar upx xz zlib-dev zlib-static \
                zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup-haskell
        with:
          ghc-version: "${{ matrix.ghc }}"
          cabal-version: 'latest'

      - name: Configure
        run: | 
          ARCHITECTURE=$(uname -m)
          echo "ARCH=$ARCHITECTURE" >> $GITHUB_ENV
          echo ${{ env.ARCH }}
          cabal configure --enable-tests

      - name: Freeze
        run: cabal freeze --project-file=cabal.static.project

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('./dist-newstyle/cache/plan.json') }}

          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}

      - name: Build
        run: cabal build --project-file=cabal.static.project

      - name: Test
        run: cabal test --project-file=cabal.static.project all

      - name: Install
        run: |
          bin=$(cabal -v0 --project-file=cabal.static.project list-bin kitab)
          mkdir distribution
          install ${bin} distribution/kitab

      - name: File type
        run: file distribution/kitab

      - name: Tar kitab executable
        run: |
          KITAB_EXEC=distribution/kitab
          strip $KITAB_EXEC
          upx -9 $KITAB_EXEC
          DIR=$(dirname $KITAB_EXEC)
          FILE=$(basename $KITAB_EXEC)
          KITAB_EXEC_TAR=kitab-head-${{ runner.os }}-static-${{ env.ARCH }}.tar.zst
          tar --zstd -cvf $KITAB_EXEC_TAR -C $DIR $FILE
          echo KITAB_EXEC_TAR=$KITAB_EXEC_TAR >> $GITHUB_ENV

      - name: Upload kitab executable to workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitab-${{ runner.os }}-static-x86_64
          path: ${{ env.KITAB_EXEC_TAR }}

       
  prerelease-head:
    name: Create a GitHub prerelease with the binary artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: ['tests', 'package-linux-static', 'package-macos']

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: kitab-*
        merge-multiple: true

    - name: Create GitHub prerelease
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: kitab-head
        prerelease: true
        draft: true
        name: kitab-head
        files: |
          kitab-head-Linux-static-x86_64.tar.zst
          kitab-head-macOS-arm64.tar.zst

