name: Formatting

on:
  pull_request:
    paths:
      - "**.hs"
      - .github/workflows/fourmolu.yaml
  push:
    branches:
      - master
    paths:
      - "**.hs"
      - .github/workflows/fourmolu.yaml

jobs:
  fourmolu-formatting:
    runs-on:
      # Use GitHub hosted runner minutes for small jobs.
      - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/run-fourmolu@1b9df64b784203126500372730b9725c97e4040b # v13
        with:
          version: "0.19.0.1"
          pattern: |
            src/**/*.hs
            test/**/*.hs
            !test/golden/*.hs
